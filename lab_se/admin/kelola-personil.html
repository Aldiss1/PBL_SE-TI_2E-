<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kelola Personil - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body id="page-admin-personil" class="admin-main">

  <main class="main-content-sheet">

    <div class="content-navbar-container">
      <nav class="content-navbar">
        <a class="header-logo d-none d-lg-block" href="dashboard.html">Admin</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a> <a class="nav-link" href="kelola-personil.html">Personil</a> <a class="nav-link" href="kelola-anggota.html">Anggota</a>
        <a class="nav-link" href="kelola-pendaftar.html">Pendaftar</a>
        <a class="nav-link" href="kelola-blog.html">Blog</a> <a class="btn btn-outline-danger btn-sm ms-auto" href="#" id="admin-logout-btn">Logout</a>
      </nav>
    </div>

    <div class="admin-header-flex">
      <h4 class="mb-0">Kelola Personil</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPersonil">Tambah Personil</button>
    </div>

    <div id="admin-personil-list" class="row g-3"></div>

  </main>

  <div class="modal fade" id="modalPersonil" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="form-personil-admin">
          <div class="modal-header">
            <h5 class="modal-title">Tambah / Edit Personil</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="p-id">
            <div class="mb-3">
              <label class="form-label">Nama</label>
              <input id="p-nama" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Posisi</label>
              <input id="p-posisi" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Bio</label>
              <textarea id="p-bio" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">URL Foto (opsional)</label>
              <input id="p-foto" class="form-control" placeholder="assets/person1.jpg">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
