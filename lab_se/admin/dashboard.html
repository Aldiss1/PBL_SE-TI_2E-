<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - Lab SE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body id="page-admin-dashboard" class="admin-main">
  
  <main class="main-content-sheet">

    <div class="content-navbar-container">
      <nav class="content-navbar">
        <a class="header-logo d-none d-lg-block" href="dashboard.html">Admin</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a> <a class="nav-link" href="kelola-personil.html">Personil</a> <a class="nav-link" href="kelola-anggota.html">Anggota</a>
        <a class="nav-link" href="kelola-pendaftar.html">Pendaftar</a>
        <a class="nav-link" href="kelola-blog.html">Blog</a> <a class="btn btn-outline-danger btn-sm ms-auto" href="#" id="admin-logout-btn">Logout</a>
      </nav>
    </div>

    <div class="admin-header-flex">
      <h4 class="mb-0">Dashboard</h4>
      <div class="small text-muted">Selamat datang, Admin</div>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <h6>Jumlah Personil</h6>
          <div class="display-6 fw-bold" id="stat-personil">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <h6>Jumlah Artikel</h6>
          <div class="display-6 fw-bold" id="stat-article">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <h6>Pendaftar</h6>
          <div class="display-6 fw-bold" id="stat-anggota">0</div>
        </div>
      </div>
    </div>

    <div class="mt-5">
      <h6>Pendaftar Terbaru</h6>
      <div id="admin-applicants" class="list-group mt-2"></div>
    </div>

  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
