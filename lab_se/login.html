<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Admin - Lab SE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="page-login">
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div style="max-width: 450px; width: 100%;">
      <main class="main-content-sheet">
        <div class="text-center mb-4">
          <a class="header-logo" href="index.html">Lab SE</a>
          <h4 class="h5 mt-2 text-muted">Admin Login</h4>
        </div>
        
        <form id="admin-login-form">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="admin-username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="admin-password" type="password" class="form-control" required>
          </div>
          <div class="d-grid pt-2">
            <button class="btn btn-primary" type="submit">Login</button>
          </div>
        </form>
        <div class="small text-muted mt-3">Demo: username <em>admin</em> / password <em>admin123</em></div>
      </main>

      <div class="text-center mt-4">
        <a href="index.html" class="link-primary">← Kembali ke Beranda</a>
      </div>
      <div class="text-center mt-3 small text-muted">
        &copy; <span id="footer-year"></span> Lab Software Engineering
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
