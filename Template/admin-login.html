<!DOCTYPE html>
<html class="no-js" lang="id">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Admin Login - Web Profile Laboratorium SE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <link rel="stylesheet" href="assets/css/bootstrap-5.0.0-alpha-2.min.css" />
    <link rel="stylesheet" href="assets/css/LineIcons.2.0.css"/>
    <link rel="stylesheet" href="assets/css/animate.css"/>
    <link rel="stylesheet" href="assets/css/lindy-uikit.css"/>
    <style> html { overflow-y: scroll; } </style>
</head>
<body>
    
    <div class="preloader">
      <div class="loader">
        <div class="spinner">
          <div class="spinner-container">
            <div class="spinner-rotator">
              <div class="spinner-left"><div class="spinner-circle"></div></div>
              <div class="spinner-right"><div class="spinner-circle"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <section id="login-admin" class="contact-section contact-style-6 pt-150 pb-100">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6">
                
                <div class="section-title text-center mb-60">
                    <h2 class="mb-25 wow fadeInUp" data-wow-delay=".2s">Halaman Login Admin</h2>
                    <p class="wow fadeInUp" data-wow-delay=".4s">Silakan login untuk mengakses dashboard.</p>
                </div>

                <div class="contact-form-wrapper wow fadeInUp" data-wow-delay=".6s">
                    <form id="login-form">
                      <div class="row">
                        <div class="col-md-12">
                          <div class="single-input">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" class="form-input" placeholder="Masukkan Username Admin" required>
                            <i class="lni lni-user"></i>
                          </div>
                        </div>
                        <div class="col-md-12">
                          <div class="single-input">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan Password" required>
                            <i class="lni lni-lock-alt"></i> 
                          </div>
                        </div>
                        <div class="col-md-12">
                          <div class="form-button text-center">
                            <a href="admin-dashboard.html" class="button radius-10">Login</a>
                          </div>
                        </div>
                      </div>
                    </form>
                  </div>

            </div>
          </div>
        </div>
      </section>

    <footer class="footer footer-style-1">
        <div class="container">
          <div class="copyright-wrapper wow fadeInUp" data-wow-delay=".2s">
            <p>Admin Panel - Laboratorium Software Engineering</p>
          </div>
        </div>
    </footer>

    <script src="assets/js/bootstrap.5.0.0.alpha-2.min.js"></script>
    <script src="assets/js/count-up.min.js"></script>
    <script src="assets/js/wow.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
